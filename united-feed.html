<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมการกินอาหารสุกร - PN AGRO TRADE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #fff5f7; margin: 0; padding: 0; }
        .gradient-header { background: linear-gradient(135deg, #9d174d 0%, #db2777 100%); }
        .product-card { border-bottom: 1px solid #fce7f3; min-height: 160px; page-break-inside: avoid; }
        .img-box { width: 110px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-width: 100%; max-height: 100px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15)); }
        .huge-number { font-size: 1.6rem; line-height: 1; font-weight: 700; color: #1f2937; }
        .huge-number-pink { font-size: 1.6rem; line-height: 1; font-weight: 700; color: #be185d; }
        @media print {
            .no-print { display: none !important; }
            .a4-container { width: 100% !important; margin: 0 !important; box-shadow: none !important; border-radius: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        .a4-container { width: 210mm; min-height: 297mm; margin: 10px auto; background: white; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div class="max-w-[210mm] mx-auto mb-2 p-3 bg-white shadow no-print flex justify-between items-center border-b-2 border-pink-500">
        <div id="status-display" class="text-xs font-bold text-gray-400">📡 เตรียมโหลดข้อมูล...</div>
        <button onclick="fetchPrices()" class="bg-pink-600 text-white px-4 py-1 rounded-full text-xs font-bold shadow-md hover:bg-pink-700">🔄 อัปเดตราคา</button>
    </div>

    <div class="a4-container shadow-2xl rounded-[1.5rem] overflow-hidden">
        <div class="gradient-header p-4 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold">โปรแกรมการกินอาหารสุกร ยูไนเต็ด</h1>
            <p class="text-pink-100 text-sm font-light">(สูตร 1) - PN AGRO TRADE</p>
        </div>

        <div class="px-8 py-2 flex-grow flex flex-col gap-y-1">
            
            <div class="product-card flex flex-row gap-6 py-4 items-center" data-match="S80S" data-use="0.5">
                <div class="img-box"><img src="S80S.png" alt="S80S"></div>
                <div class="flex-grow">
                    <div class="flex justify-between items-baseline">
                        <h2 class="text-xl font-bold text-pink-800 leading-tight">ยูไนเต็ด S80S</h2>
                        <span class="bg-pink-700 text-white text-[12px] px-3 py-0.5 rounded-full font-bold uppercase">หมูเลียราง</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center mt-3">
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-100"><p class="text-[10px] text-gray-400 font-bold uppercase italic">ใช้ 0.5 ถุง</p></div>
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-100"><p class="huge-number price-val">--</p></div>
                        <div class="bg-pink-50 p-2 rounded-xl border border-pink-100 text-pink-700"><p class="huge-number-pink net-val">--</p></div>
                    </div>
                </div>
            </div>

            <div class="product-card flex flex-row gap-6 py-4 items-center" data-match="S20T" data-use="0.5">
                <div class="img-box"><img src="S20T.png" alt="S20T"></div>
                <div class="flex-grow">
                    <div class="flex justify-between items-baseline">
                        <h2 class="text-xl font-bold text-pink-800 leading-tight">ยูไนเต็ด S20T</h2>
                        <span class="bg-pink-700 text-white text-[12px] px-3 py-0.5 rounded-full font-bold uppercase">หมูอนุบาล</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center mt-3">
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-100"><p class="text-[10px] text-gray-400 font-bold uppercase italic">ใช้ 0.5 ถุง</p></div>
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-100"><p class="huge-number price-val">--</p></div>
                        <div class="bg-pink-50 p-2 rounded-xl border border-pink-100 text-pink-700"><p class="huge-number-pink net-val">--</p></div>
                    </div>
                </div>
            </div>

            <div class="product-card flex flex-row gap-6 py-4 items-center" data-match="S21" data-use="2">
                <div class="img-box"><img src="S21.png" alt="S21"></div>
                <div class="flex-grow">
                    <div class="flex justify-between items-baseline">
                        <h2 class="text-xl font-bold text-pink-800 leading-tight">ยูไนเต็ด S21</h2>
                        <span class="bg-pink-700 text-white text-[12px] px-3 py-0.5 rounded-full font-bold uppercase">หมูเล็ก</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center mt-3">
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-100"><p class="text-[10px] text-gray-400 font-bold uppercase italic">ใช้ 2 ถุง</p></div>
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-100"><p class="huge-number price-val">--</p></div>
                        <div class="bg-pink-50 p-2 rounded-xl border border-pink-100 text-pink-700"><p class="huge-number-pink net-val">--</p></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mt-8 bg-gray-50 p-5 rounded-2xl border-2 border-yellow-400">
                <div>
                    <p class="text-xs font-black text-gray-400 uppercase tracking-widest">หจก. พีเอ็น อะโกร เทรด</p>
                    <h3 class="text-xl font-black text-gray-800 italic uppercase">UNITED FEED PROGRAM</h3>
                </div>
                <div class="text-right">
                    <p class="text-xs font-bold text-gray-400 uppercase">ต้นทุนรวมสุทธิ / ตัว</p>
                    <h3 class="text-4xl font-black text-green-700" id="grand-total">฿0</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ใช้ลิงก์ CSV ตรงๆ ไม่ผ่าน Proxy แล้วครับ
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOz2mDLKhBRGJGmT17zqLsuPBJIr3sLZEAUaXPQRdBxhgw1RXJ5KOwGQONh9YccgDx8GkDnBm9WusP/pub?output=csv';

        async function fetchPrices() {
            const status = document.getElementById('status-display');
            try {
                // ดึงข้อมูลตรงๆ พร้อมเติม Timestamp ป้องกันการดึงข้อมูลเก่า
                const response = await fetch(CSV_URL + '&t=' + new Date().getTime());
                if (!response.ok) throw new Error();
                
                const data = await response.text();
                // แยกแถว (CSV)
                const rows = data.split('\n').map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
                
                let grandTotal = 0;

                document.querySelectorAll('.product-card').forEach(card => {
                    const key = card.dataset.match;
                    const useVal = parseFloat(card.dataset.use);
                    
                    // ค้นหาแถวที่มีชื่อสินค้าใน Column A
                    const row = rows.find(r => r[0] && r[0].toUpperCase().includes(key.toUpperCase()));

                    if (row) {
                        // ราคาใน Column E (Index 4)
                        const priceStr = row[4] || "0";
                        const price = parseFloat(priceStr.replace(/[^0-9.]/g, '')) || 0;
                        const net = price * useVal;
                        
                        card.querySelector('.price-val').innerText = price.toLocaleString();
                        card.querySelector('.net-val').innerText = net.toLocaleString();
                        grandTotal += net;
                    }
                });

                document.getElementById('grand-total').innerText = '฿' + grandTotal.toLocaleString();
                status.innerText = "📡 ข้อมูลอัปเดตเรียบร้อย ✅";
                status.className = "text-xs font-bold text-green-600";
            } catch (err) {
                status.innerText = "❌ เชื่อมต่อไม่ได้ (ลองกดรีเฟรช)";
                status.className = "text-xs font-bold text-red-600";
            }
        }
        window.onload = fetchPrices;
    </script>
</body>
</html>
