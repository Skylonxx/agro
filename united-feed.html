<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบตรวจสอบราคา PN AGRO</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>สถานะการเชื่อมต่อ: <span id="status" style="color: gray;">กำลังโหลด...</span></h2>
    <div id="result"></div>

    <script>
        // ลิงก์ CSV ของคุณฉัตร
        const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOz2mDLKhBRGJGmT17zqLsuPBJIr3sLZEAUaXPQRdBxhgw1RXJ5KOwGQONh9YccgDx8GkDnBm9WusP/pub?output=csv';

        async function load() {
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            try {
                // เพิ่มโหมด cors เพื่อขออนุญาตดึงข้อมูลตรงๆ
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) throw new Error('Google Sheets ปฏิเสธการเข้าถึง');
                
                const text = await response.text();
                const lines = text.split('\n');
                
                let table = '<table border="1" style="width:100%; border-collapse:collapse;">';
                table += '<tr style="background:#eee;"><th>รหัส (Col A)</th><th>ราคา (Col E)</th></tr>';
                
                lines.forEach((line, i) => {
                    if(i > 0 && line.trim() !== "") {
                        const cols = line.split(',');
                        table += `<tr><td>${cols[0]}</td><td><b>${cols[4] || '0'}</b></td></tr>`;
                    }
                });
                table += '</table>';
                
                result.innerHTML = table;
                status.innerText = "เชื่อมต่อสำเร็จ ✅";
                status.style.color = "green";
            } catch (err) {
                status.innerText = "เชื่อมต่อไม่ได้ ❌ (สาเหตุ: " + err.message + ")";
                status.style.color = "red";
                result.innerHTML = "<p>แนะนำ: ลองเปิดผ่าน 'มือถือ' หรืออัปโหลดไฟล์ขึ้นเว็บจริงครับ</p>";
            }
        }
        load();
    </script>
</body>
</html>
