<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมการกินอาหารสุกร - PN AGRO TRADE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-pink-50 p-4">
    <div class="max-w-[210mm] mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden p-8">
        <h1 class="text-3xl font-bold text-pink-600 border-b-4 border-pink-600 pb-2 mb-6 text-center">PN AGRO TRADE - อัปเดตราคาล่าสุด</h1>
        
        <div id="loading-status" class="text-center py-10 text-xl font-bold text-gray-400">⏳ กำลังดึงราคาล่าสุดจากระบบ...</div>
        
        <div id="price-table" class="hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-pink-600 text-white">
                        <th class="p-4 rounded-tl-xl">สูตรอาหาร</th>
                        <th class="p-4 text-right rounded-tr-xl">ราคาต่อถุง (Col E)</th>
                    </tr>
                </thead>
                <tbody id="data-rows" class="text-lg"></tbody>
            </table>
            <p class="mt-8 text-center text-gray-400 italic text-sm">ข้อมูลอัปเดตสดจาก Google Sheets ของคุณฉัตร</p>
        </div>
    </div>

    <script>
        // เปลี่ยนตรงนี้เป็น URL ที่ได้จาก Apps Script นะครับคุณฉัตร
        const APPS_SCRIPT_URL = 'URL_เว็บแอป_ของคุณ'; 

        async function loadData() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const rows = await response.json();
                
                let html = "";
                // วนลูปเช็คข้อมูล (แถวแรกเป็นหัวตาราง ให้ข้ามไปเริ่ม i=1)
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i][0]) { // ถ้ามีชื่อสินค้าใน Column A
                        html += `<tr class="border-b border-pink-100 hover:bg-pink-50">
                            <td class="p-4 font-bold text-gray-700">${rows[i][0]}</td>
                            <td class="p-4 text-right text-pink-600 font-black">฿${Number(rows[i][4] || 0).toLocaleString()}</td>
                        </tr>`;
                    }
                }
                
                document.getElementById('data-rows').innerHTML = html;
                document.getElementById('loading-status').classList.add('hidden');
                document.getElementById('price-table').classList.remove('hidden');
                
            } catch (err) {
                document.getElementById('loading-status').innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อ";
                console.error(err);
            }
        }
        loadData();
    </script>
</body>
</html>
